# LK-CUTOVER-001 C4 — auto-deploy the hosted candidate and prove it synthetically.
#
# Triggers: explicitly qualified revisions only — version tags or a manual
# run at a chosen ref; branch pushes never deploy. Toolchain is pinned
# (seq58 defect): wrangler 4.168.0 from npm, worker-build 0.9.0 from cargo
# (--locked), and each run tags the built toolchain with the Git SHA.
# Deploys apps/lighting-worker (wrangler) then runs an MCP read/write proof
# against the deployed worker with SYNTHETIC data only (scope
# project=deploy-proof). No live Basic Memory, no production traffic.
#
# Entry contract (072395b, cherry-picked as 54ffc72): wrangler.jsonc "main"
# is the GENERATED build/worker/shim.mjs (worker-build runs via the config
# build.command). A verification step below fails fast if a branch drifts
# back to a source-path entry like src/lib.rs.
#
# Secrets referenced by NAME only (values live in the repository secret
# store, never in this tree):
#   CLOUDFLARE_API_TOKEN     - Wrangler API token (deploy + d1 execute)
#   CLOUDFLARE_ACCOUNT_ID    - Cloudflare account id
#   LANTERN_WORKER_URL       - deployed worker origin, e.g.
#                              https://lantern-keeper-mcp.<subdomain>.workers.dev
#   LANTERN_MCP_DEPLOY_TOKEN - raw bearer token whose SHA-256 is registered
#                              in the worker's LANTERN_MCP_CREDENTIALS secret
#                              with read+write on scope {"project":"deploy-proof"}
#
# Proof sequence (mirrors docs/lk-cutover-001-smoke.md §1/§2/§4):
#   initialize (health/version) -> tools/list -> seed synthetic belief (D1,
#   insert-if-absent) -> search (read + revision) -> correct with key (write
#   + receipt) -> search (durable read-back) -> replay (same receipt) ->
#   stale revision (409 revision_conflict, nothing written) -> blank value
#   (400 typed invalid).

name: Lantern Cloud Deploy

on:
  push:
    tags: ["lantern-cutover-v*"]
  workflow_dispatch:
    inputs:
      export_manifest:
        description: "Optional export manifest JSON (with record_counts) for the D1-direct reconcile probe"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lantern-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LANTERN_WORKER_URL: ${{ secrets.LANTERN_WORKER_URL }}
      LANTERN_MCP_DEPLOY_TOKEN: ${{ secrets.LANTERN_MCP_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned toolchain (wrangler 4.168.0, worker-build 0.9.0)
        run: |
          set -euo pipefail
          # worker-build is the Rust cargo package, not an npm module
          # (toolchain defect, seq58).
          npm install -g wrangler@4.168.0
          cargo install worker-build --version 0.9.0 --locked
          wrangler --version
          worker-build --version

      - name: Tag the build toolchain with the deployed revision
        run: |
          set -euo pipefail
          {
            echo "### Lantern cloud deploy"
            echo "- revision: ${GITHUB_SHA}"
            echo "- wrangler: $(wrangler --version)"
            echo "- worker-build: $(worker-build --version)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build-tag: worker-build $(worker-build --version) @ ${GITHUB_SHA}"

      - name: Verify worker entry path (generated shim contract)
        working-directory: apps/lighting-worker
        run: |
          set -euo pipefail
          # wrangler.jsonc carries no comments: plain jq parse is safe.
          MAIN="$(jq -r '.main' wrangler.jsonc)"
          if [ "$MAIN" != "build/worker/shim.mjs" ]; then
            echo "wrangler main is '$MAIN'; expected build/worker/shim.mjs (072395b)" >&2
            exit 1
          fi
          if ! jq -r '.build.command' wrangler.jsonc | grep -q 'worker-build'; then
            echo "wrangler build.command must run worker-build to generate the shim" >&2
            exit 1
          fi
          echo "entry: $MAIN (generated by $(jq -r '.build.command' wrangler.jsonc))"

      - name: Deploy worker
        working-directory: apps/lighting-worker
        run: wrangler deploy --config wrangler.jsonc

      - name: MCP health, version and synthetic read/write proof
        working-directory: apps/lighting-worker
        run: |
          set -euo pipefail

          mcp_call() {
            # $1: JSON-RPC payload. Prints response body; transport errors fail the step.
            curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST "${LANTERN_WORKER_URL}/mcp" \
              -H "authorization: Bearer ${LANTERN_MCP_DEPLOY_TOKEN}" \
              -H "content-type: application/json" \
              --data "$1"
          }

          mcp_status() {
            # $1: payload; prints "<http_code>\n<body>".
            local body_file
            body_file="$(mktemp)"
            local code
            code="$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
              -o "$body_file" -w '%{http_code}' \
              -X POST "${LANTERN_WORKER_URL}/mcp" \
              -H "authorization: Bearer ${LANTERN_MCP_DEPLOY_TOKEN}" \
              -H "content-type: application/json" \
              --data "$1")"
            printf '%s\n' "$code"
            cat "$body_file"
            rm -f "$body_file"
          }

          echo "== 1. health/version: initialize =="
          INIT="$(mcp_call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"lantern-deploy-proof","version":"0.1.0"}}}')"
          echo "$INIT" | jq -e '.result.protocolVersion == "2026-07-28"' >/dev/null
          echo "$INIT" | jq -e '.result.serverInfo.name == "lantern-keeper-mcp"' >/dev/null
          echo "server version: $(echo "$INIT" | jq -r '.result.serverInfo.version')"

          echo "== 2. tools/list =="
          TOOLS="$(mcp_call '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          echo "$TOOLS" | jq -e '.result.tools | length == 5' >/dev/null
          echo "$TOOLS" | jq -e '[.result.tools[].name] | index("lantern_correct") != null' >/dev/null

          echo "== 3. seed synthetic belief (insert-if-absent, D1) =="
          SCOPE_JSON='{"project":"deploy-proof"}'
          SCOPE_HASH="$(printf 'project=deploy-proof\n' | sha256sum | awk '{print $1}')"
          EXISTING="$(wrangler d1 execute lantern-keeper --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS c FROM belief WHERE id = 'deploy-proof-b1'" \
            | jq -r '.[0].results[0].c')"
          if [ "$EXISTING" = "0" ]; then
            PAYLOAD="$(jq -nc --arg sh "$SCOPE_HASH" '{id:"deploy-proof-b1",holder_key:"matthew",subject_key:"deploy-proof",predicate_key:"synthetic_field",current_value:"synthetic-1",scope:{"project":"deploy-proof"},scope_hash:$sh,state:"Active",confidence:0.9,trust_class:"Direct",known_from:"2026-11-24T00:00:00Z",known_to:null,valid_from:null,valid_to:null,stale:false,stale_since:null,stale_reason:null,dependency_generation:0,lineage:{supporting_claim_ids:[],contradictory_claim_ids:[],prior_belief_id:null,derived_from_belief_ids:[]},created_at:"2026-11-24T00:00:00Z",updated_at:"2026-11-24T00:00:00Z"}')"
            SQL="INSERT INTO belief (id, scope_hash, scope, holder_key, subject_key, predicate_key, current_value, state, stale, stale_since, stale_reason, dependency_generation, updated_at, payload) VALUES ('deploy-proof-b1', '${SCOPE_HASH}', '${SCOPE_JSON}', 'matthew', 'deploy-proof', 'synthetic_field', 'synthetic-1', 'Active', 0, NULL, NULL, 0, '2026-11-24T00:00:00Z', '${PAYLOAD}');"
            wrangler d1 execute lantern-keeper --remote --config wrangler.jsonc --command "$SQL"
          else
            echo "seed belief already present (rerun); leaving it in place"
          fi

          SCOPE_ARG='{"scope":{"project":"deploy-proof"}}'

          echo "== 4. synthetic read: search + revision =="
          SEARCH="$(mcp_call '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"lantern_search","arguments":{"query":"synthetic-1","scope":{"project":"deploy-proof"},"limit":64}}}')"
          RESULT4="$(echo "$SEARCH" | jq -r '.result.content[0].text' | jq -c '.')"
          echo "$RESULT4" | jq -e '.count >= 1' >/dev/null
          CURRENT_REV="$(echo "$RESULT4" | jq -r '.results[0].current_revision')"
          [ -n "$CURRENT_REV" ] && [ "$CURRENT_REV" != "null" ]

          echo "== 5. synthetic write: keyed correction =="
          KEY="deploy-proof-${GITHUB_RUN_ID}"
          CORRECT_PAYLOAD="$(jq -nc --arg rev "$CURRENT_REV" --arg key "$KEY" '{jsonrpc:"2.0",id:5,method:"tools/call",params:{name:"lantern_correct",arguments:{belief_id:"deploy-proof-b1",scope:{"project":"deploy-proof"},expected_revision:$rev,new_value:"synthetic-1-fixed",idempotency_key:$key}}}')"
          CORRECT="$(mcp_call "$CORRECT_PAYLOAD")"
          RECEIPT="$(echo "$CORRECT" | jq -r '.result.content[0].text' | jq -c '.')"
          echo "$RECEIPT" | jq -e '.replayed == false' >/dev/null
          RECEIPT_ID="$(echo "$RECEIPT" | jq -r '.receipt_id')"
          [ -n "$RECEIPT_ID" ] && [ "$RECEIPT_ID" != "null" ]

          echo "== 6. durable read-back in a fresh session =="
          VERIFY="$(mcp_call '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"lantern_search","arguments":{"query":"synthetic-1-fixed","scope":{"project":"deploy-proof"},"limit":64}}}')"
          echo "$VERIFY" | jq -r '.result.content[0].text' | jq -e '.count >= 1' >/dev/null

          echo "== 7. idempotent replay: same key, same payload =="
          REPLAY="$(mcp_call "$CORRECT_PAYLOAD")"
          RECEIPT2="$(echo "$REPLAY" | jq -r '.result.content[0].text' | jq -c '.')"
          echo "$RECEIPT2" | jq -e '.replayed == true' >/dev/null
          [ "$(echo "$RECEIPT2" | jq -r '.receipt_id')" = "$RECEIPT_ID" ]

          echo "== 8. stale expected_revision -> 409 revision_conflict, nothing written =="
          CONFLICT_PAYLOAD="$(jq -nc '{jsonrpc:"2.0",id:8,method:"tools/call",params:{name:"lantern_correct",arguments:{belief_id:"deploy-proof-b1",scope:{"project":"deploy-proof"},expected_revision:"1999-01-01T00:00:00Z",new_value:"synthetic-should-not-apply",idempotency_key:("deploy-proof-conflict-" + (env.GITHUB_RUN_ID // "x"))}}}')"
          CONFLICT="$(mcp_status "$CONFLICT_PAYLOAD")"
          CONFLICT_CODE="$(echo "$CONFLICT" | sed -n '1p')"
          [ "$CONFLICT_CODE" = "409" ]
          echo "$CONFLICT" | tail -n +2 | jq -e 'has("error")' >/dev/null

          echo "== 9. invalid envelope -> 400 typed invalid, nothing written =="
          INVALID_PAYLOAD="$(jq -nc '{jsonrpc:"2.0",id:9,method:"tools/call",params:{name:"lantern_correct",arguments:{belief_id:"deploy-proof-b1",scope:{"project":"deploy-proof"},expected_revision:"2026-11-24T00:00:00Z",new_value:"",idempotency_key:("deploy-proof-invalid-" + (env.GITHUB_RUN_ID // "x"))}}}')"
          INVALID="$(mcp_status "$INVALID_PAYLOAD")"
          INVALID_CODE="$(echo "$INVALID" | sed -n '1p')"
          [ "$INVALID_CODE" = "400" ]
          echo "$INVALID" | tail -n +2 | jq -e 'has("error")' >/dev/null

          echo "== 10. nothing from steps 8/9 persisted =="
          POST_FAIL="$(mcp_call '{"jsonrpc":"2.0","id":10,"method":"tools/call","params":{"name":"lantern_search","arguments":{"query":"synthetic-should-not-apply","scope":{"project":"deploy-proof"},"limit":64}}}')"
          echo "$POST_FAIL" | jq -r '.result.content[0].text' | jq -e '.count == 0' >/dev/null

          echo "MCP synthetic read/write proof: PASS (deploy ${GITHUB_SHA})"

      - name: D1-direct reconcile probe (counts + payload fingerprints)
        working-directory: apps/lighting-worker
        env:
          EXPORT_MANIFEST: ${{ inputs.export_manifest }}
        run: |
          set -euo pipefail
          # Raw D1-side reconciliation (seq57): reads the hosted database
          # directly with wrangler, independent of any REST surface. Payload
          # byte sums act as content fingerprints (no crypto hash in D1 SQL).
          # Post-seed additions (e.g. the synthetic deploy-proof belief)
          # surface as explicit mismatches — fail visible, never silent.
          SEEDED="$(wrangler d1 execute lantern-keeper --remote --config wrangler.jsonc --json --command "SELECT (SELECT COUNT(*) FROM source) AS source, (SELECT COUNT(*) FROM episode) AS episode, (SELECT COUNT(*) FROM epistemic_claim) AS epistemic_claim, (SELECT COUNT(*) FROM belief) AS belief, (SELECT COALESCE(SUM(LENGTH(payload)),0) FROM epistemic_claim) AS claim_payload_bytes, (SELECT COALESCE(SUM(LENGTH(payload)),0) FROM belief) AS belief_payload_bytes, (SELECT value FROM schema_meta WHERE key = 'schema_version') AS schema_version")"
          echo "$SEEDED" | jq .
          RESULTS="$(echo "$SEEDED" | jq -c '.[0].results[0]')"
          if [ -n "${EXPORT_MANIFEST:-}" ]; then
            echo "$EXPORT_MANIFEST" | jq -e '.record_counts' >/dev/null || {
              echo "export_manifest input must contain record_counts" >&2
              exit 1
            }
            for T in source episode epistemic_claim belief; do
              WANT="$(echo "$EXPORT_MANIFEST" | jq -r --arg t "$T" '.record_counts[$t] // empty')"
              [ -n "$WANT" ] || continue
              GOT="$(echo "$RESULTS" | jq -r --arg t "$T" '.[$t]')"
              if [ "$GOT" != "$WANT" ]; then
                echo "MISMATCH $T: D1 has $GOT, export manifest says $WANT" >&2
                exit 1
              fi
              echo "match $T: $GOT"
            done
            echo "D1-direct reconcile: PASS"
          else
            echo "no export_manifest input — counts and fingerprints printed above for operator comparison (not asserted)"
          fi
