[workspace]
members = [
    "apps/lighting",
    "crates/lighting-cli",
    "crates/lighting-core",
    "crates/lighting-service",
    "crates/lighting-store-surreal",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matthewjameswatkins1978-cyber/lantern-keeper"
rust-version = "1.98.1"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
surrealdb = { version = "=3.3.0-beta.4", default-features = false, features = ["kv-surrealkv", "protocol-ws"] }
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time", "io-util", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
