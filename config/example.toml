# Example Lighting configuration
# Copy this file to config/local.toml and adjust values for your workstation.
# Do not commit files containing secrets.

[service]
host = "127.0.0.1"
port = 4317

[service.log]
level = "info"

# SurrealDB configuration for the canonical Source and Memory stores.
[storage.surreal]
endpoint = "ws://127.0.0.1:8000"
namespace = "lantern_keeper"
database = "lighting_dev"
username = "root"
# password must be provided through environment or an override file
