# Example Lighting configuration
# Copy this file to config/local.toml and adjust values for your workstation.
# Do not commit files containing secrets.

[service]
host = "127.0.0.1"
port = 4317

[service.log]
level = "info"

# The normal local path is embedded, versioned SurrealKV. The current
# application reads these settings from environment variables; this file is
# retained as a human-readable configuration reference.
[storage.surreal]
storage = "embedded-surrealkv"
path = ".lighting-data/surrealkv"
endpoint = "ws://127.0.0.1:8000"
namespace = "lantern_keeper"
database = "lighting_dev"
username = "root"
# password must be provided through environment or an override file
